name: camrent_mobile
description: "CamRent — camera rental marketplace mobile app (Flutter + BLoC)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — BLoC pattern
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^10.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Dependency injection
  get_it: ^8.0.3

  # Routing
  go_router: ^14.6.2

  # Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # UI helpers
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  geolocator: ^13.0.2

  # Encrypted local cache (offline-first / fewer API calls)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_logo.png

# Native launch screen — replaces the default white Flutter splash with the
# CamRentPH logo on the brand background.
flutter_native_splash:
  color: "#F0ECE6"
  image: assets/splash_logo.png
  android_12:
    color: "#F0ECE6"
    image: assets/splash_logo.png
  ios: true
  android: true

# App launcher icon.
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#D9A26A"
  adaptive_icon_foreground: "assets/logo.png"
